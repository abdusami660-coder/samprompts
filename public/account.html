              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="theme-text">Theme</span>
        </button>

  <main>
    <div class="container">
      <div class="account-wrap" id="account-container">
        <div style="text-align:center;padding:50px;color:var(--muted);">Loading your account…</div>

  <!-- Floating WhatsApp Support -->

    <span>Support</span>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="f-left">
        <div class="footer-brand">
          <img src="/assets/img/logo.png" alt="Sami Prompts Logo">
          <span>Sami<b>Prompts</b></span>
        </div>
        <p class="footer-tag">Viral AI video prompts by Sami</p>
      </div>
      <nav class="footer-nav f-center">
        <a href="/browse">All Prompts</a>
        <span class="footer-dot">·</span>

  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        const container = document.getElementById('account-container');

        if (!data.user) {
          window.location.href = '/login?next=/account';
          return;
        }

        const user = data.user;
        const isPremium = user.membership_status === 'premium';
        let expiryDisplay = 'Inactive';
        let daysLeftText = '';

        if (isPremium && user.membership_expires_at) {
          const expDate = new Date(user.membership_expires_at);
          const diffMs = expDate - new Date();
          const daysLeft = Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
          expiryDisplay = expDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          daysLeftText = `(${daysLeft} days left)`;
        }

        container.innerHTML = `
          <h1 style="margin-bottom:24px;font-size:28px;">My Account</h1>

          <!-- Profile Card -->
          <div class="acc-card">
            <h3>👤 Profile</h3>
            <p><strong>Name:</strong> ${escapeHtml(user.name)}</p>
            <p><strong>Email:</strong> ${escapeHtml(user.email)}</p>
            <p><strong>Joined:</strong> 12 Aug 2026</p>
            ${user.role === 'admin' ? '<p style="margin-top:8px;"><span class="badge" style="background:var(--primary-light);color:var(--primary);border:1px solid var(--card-border);">⚡ Super Admin</span></p>' : ''}
          </div>

          <!-- Membership Card -->
          <div class="acc-card">
            <h3>💳 Membership</h3>
            <div style="margin-bottom:12px;">
              <span class="badge ${isPremium ? 'badge-active' : 'badge-free'}">
                ${isPremium ? 'Active' : 'Free Plan'}
              </span>
            </div>
            ${isPremium ? `
              <p><strong>Valid until:</strong> ${expiryDisplay} ${daysLeftText}</p>
              <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
                <a href="/browse" class="btn btn-primary">Browse All Prompts</a>
                <button type="button" class="btn btn-outline" onclick="NP.openCheckout()">Renew Access</button>
              </div>
            ` : `
              <p style="color:var(--muted);margin-bottom:14px;">You currently have free access. Upgrade to unlock all premium master prompts and storyboards.</p>
              <button type="button" class="btn btn-primary" onclick="NP.openCheckout()">Upgrade to VIP — $5/mo</button>
            `}
          </div>

          <!-- Bookmarked Prompts -->
          <div class="acc-card" id="bookmarks-card" style="display:none;">
            <h3>⭐ Saved Prompts</h3>
            <div id="bookmarks-list"></div>
          </div>
        `;

        // Check bookmarks
        const bRes = await fetch('/api/bookmarks');
        if (bRes.ok) {
          const bData = await bRes.json();
          if (bData.prompts && bData.prompts.length > 0) {
            document.getElementById('bookmarks-card').style.display = 'block';
            document.getElementById('bookmarks-list').innerHTML = bData.prompts.map(p => `
              <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                <a href="/prompt?id=${p.id}" style="font-weight:600;">${escapeHtml(p.title)}</a>
                <span class="badge ${p.type === 'free' ? 'badge-active' : ''}">${p.type}</span>
              </div>
            `).join('');
          }
        }
      } catch (err) {
        console.error('Account load error:', err);
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sami Prompts</title>
  <meta name="description" content="Sign in to your Sami Prompts creator account.">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function() {
      const saved = localStorage.getItem('sami_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo.png" alt="Sami Prompts Logo">
        <span>Sami<b>Prompts</b></span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle-cb">
      <label for="nav-toggle" class="nav-toggle">☰</label>
      <nav class="main-nav" id="main-nav">
        <!-- Dynamic header -->
      </nav>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
          <span class="theme-icon moon-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12.3 2a10 10 0 0 0-.19 20 10 10 0 0 0 8.09-4.11 1 1 0 0 0-1-1.49 8 8 0 1 1-8.39-14.3 1 1 0 0 0 .49-1.1 1 1 0 0 0-1-.02z"/></svg>
          </span>
          <span class="theme-icon sun-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="theme-text">Theme</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-box">
        <h1>Welcome Back</h1>
        <p class="sub">Log in to your Sami Prompts Studio</p>

        <div id="login-alert" class="alert-msg"></div>

        <form id="login-form">
          <div class="fld">
            <label>Email Address</label>
            <input type="email" id="login-email" required placeholder="your@email.com">
          </div>
          <div class="fld">
            <label>Password</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
            Login with Password
          </button>
        </form>

        <p class="auth-alt">
          Don't have an account? <a href="/register">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="f-left">
        <div class="footer-brand">
          <img src="/assets/img/logo.png" alt="Sami Prompts Logo">
          <span>Sami<b>Prompts</b></span>
        </div>
        <p class="footer-tag">Viral AI video prompts by Sami</p>
      </div>
      <nav class="footer-nav f-center">
        <a href="/browse">All Prompts</a>
        <span class="footer-dot">·</span>
        <a href="/community">Social Corner</a>
        <span class="footer-dot">·</span>
        <a href="/pricing">Join Community</a>
        <span class="footer-dot">·</span>
        <a href="/privacy">Privacy</a>
        <span class="footer-dot">·</span>
        <a href="/terms">Terms</a>
      </nav>
      <div class="f-right">
        <p class="footer-copy">© 2026 Sami Prompts</p>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating…';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: emailInput.value.trim(),
              password: passInput.value
            })
          });

          const data = await res.json();
          if (data.success) {
            alertBox.className = 'alert-msg success';
            alertBox.textContent = '✅ Login successful! Redirecting…';
            alertBox.style.display = 'block';

            const urlParams = new URLSearchParams(window.location.search);
            const next = urlParams.get('next') || '/account';
            setTimeout(() => {
              window.location.href = next;
            }, 800);
          } else {
            alertBox.className = 'alert-msg error';
            alertBox.textContent = data.error || 'Invalid credentials.';
            alertBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login with Password';
          }
        } catch (err) {
          alertBox.className = 'alert-msg error';
          alertBox.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login with Password';
        }
      });
    });
  </script>
</body>
</html>

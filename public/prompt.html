  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const promptId = urlParams.get('id') || '282';

      try {
        const res = await fetch(`/api/prompts/${promptId}`);
        if (!res.ok) {
          document.getElementById('prompt-container').innerHTML = `
            <div style="text-align:center;padding:40px;">
              <h2>Prompt Not Found</h2>
              <p style="color:var(--muted);margin:12px 0 20px;">The requested prompt does not exist or has been moved.</p>
              <a href="/browse" class="btn btn-primary">Browse All Prompts</a>
            </div>
          `;
          return;
        }

        const prompt = await res.json();
        document.title = `${prompt.title} — Sami Prompts`;

        let storyboardsHtml = '';
        if (prompt.storyboards && prompt.storyboards.length > 0) {
          storyboardsHtml = `
            <h3 style="font-size:16.5px;margin:28px 0 12px;font-weight:700;">🎬 Storyboard & Reference Package</h3>
            <div class="prompt-gallery">
              ${prompt.storyboards.map((img, i) => `
                <div class="gallery-item">
                  <img src="${img}" alt="Storyboard Reference ${i+1}" class="lb-img" loading="lazy">
                  <div style="margin-top:8px;">
                    <a href="${img}" download class="btn btn-sm btn-outline">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                      Download
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }

        let contentBlockHtml = '';
        if (prompt.is_unlocked) {
          contentBlockHtml = `
            ${storyboardsHtml}
            <div class="copy-bar" style="margin-top:24px;">
              <button class="btn btn-primary btn-sm" id="copy-btn" data-prompt-id="${prompt.id}">
                📋 Copy Master Prompt
              </button>
              <button type="button" class="btn btn-outline btn-sm share-btn" data-link="${window.location.href}">
                🔗 Share
              </button>
            </div>
            <div class="prompt-content" id="prompt-content">${escapeHtml(prompt.prompt_content)}</div>
          `;
        } else {
          // Locked view
          contentBlockHtml = `
            <div class="locked-box" style="margin-top:24px;">
              <div class="teaser">${escapeHtml(prompt.teaser)}</div>
              <div class="lock-panel">
                <div class="ico">🔒</div>
                <h3>Premium Master Prompt</h3>
                <p>This prompt is available exclusively for active community members.</p>
                <div class="lock-buttons">
                  <button type="button" class="btn btn-primary btn-lg" onclick="NP.openCheckout()">
                    Subscribe — $5/month
                  </button>
                  ${prompt.user_logged_in ? '' : `
                    <a href="/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}" class="btn btn-outline">
                      Already a member? Login
                    </a>
                  `}
                </div>
              </div>
            </div>
          `;
        }

        const dateFormatted = prompt.created_at ? new Date(prompt.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Recently';

        document.getElementById('prompt-container').innerHTML = `
          <a href="/browse" class="back-link">← Back to all prompts</a>
          <div class="prompt-head">
            <h1>${prompt.title}</h1>
            <div class="prompt-meta">
              <span>📂 ${prompt.category}</span>
              <span>🕒 Updated ${dateFormatted}</span>
              <span>${prompt.type === 'free' ? '🎁 Free' : '⭐ Premium'}</span>
              <span>👁 ${prompt.views_count} views</span>
            </div>
            <div class="tool-badges">
              <span class="tool-badge">Seedance 2.5</span>
              <span class="tool-badge">Kling AI</span>
              <span class="tool-badge">Google Veo</span>
              <span class="tool-badge">Dreamina</span>
              <span class="tool-badge">Hailuo Minimax</span>
            </div>
          </div>
          ${contentBlockHtml}
        `;
      } catch (err) {
        console.error('Error loading prompt details:', err);
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>

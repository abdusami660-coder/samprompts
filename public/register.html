<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — NavPrompts</title>
  <meta name="description" content="Sign up for NavPrompts to access free and premium AI video prompts.">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo.png" alt="NavPrompts Logo">
        <span>Nav<b>Prompts</b></span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle-cb">
      <label for="nav-toggle" class="nav-toggle">☰</label>
      <nav class="main-nav" id="main-nav">
        <!-- Dynamic header -->
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-box">
        <h1>Create Account</h1>
        <p class="sub">Get access to viral AI video prompts</p>

        <div id="register-alert" class="alert-msg"></div>

        <form id="register-form">
          <div class="fld">
            <label>Full Name</label>
            <input type="text" id="reg-name" required placeholder="John Doe">
          </div>
          <div class="fld">
            <label>Email Address</label>
            <input type="email" id="reg-email" required placeholder="name@example.com">
          </div>
          <div class="fld">
            <label>Password (min 6 characters)</label>
            <input type="password" id="reg-password" required minlength="6" placeholder="••••••••">
          </div>
          <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block btn-lg">
            Create Free Account
          </button>
        </form>

        <p class="auth-alt">
          Already have an account? <a href="/login">Login here</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="f-left">
        <div class="footer-brand">
          <img src="/assets/img/logo.png" alt="NavPrompts Logo">
          <span>Nav<b>Prompts</b></span>
        </div>
        <p class="footer-tag">Viral AI video prompts by Shailendra Soni</p>
      </div>
      <nav class="footer-nav f-center">
        <a href="/browse">All Prompts</a>
        <span class="footer-dot">·</span>
        <a href="/community">Social Corner</a>
        <span class="footer-dot">·</span>
        <a href="/pricing">Join Community</a>
        <span class="footer-dot">·</span>
        <a href="/privacy">Privacy</a>
        <span class="footer-dot">·</span>
        <a href="/terms">Terms</a>
      </nav>
      <div class="f-right">
        <p class="footer-copy">© 2026 NavPrompts</p>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('register-alert');
      const submitBtn = document.getElementById('reg-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account…';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: document.getElementById('reg-name').value.trim(),
              email: document.getElementById('reg-email').value.trim(),
              password: document.getElementById('reg-password').value
            })
          });

          const data = await res.json();
          if (data.success) {
            alertBox.className = 'alert-msg success';
            alertBox.textContent = '🎉 Account created! Redirecting…';
            alertBox.style.display = 'block';

            const urlParams = new URLSearchParams(window.location.search);
            const next = urlParams.get('next') || '/account';
            setTimeout(() => {
              window.location.href = next;
            }, 800);
          } else {
            alertBox.className = 'alert-msg error';
            alertBox.textContent = data.error || 'Registration failed.';
            alertBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Free Account';
          }
        } catch (err) {
          alertBox.className = 'alert-msg error';
          alertBox.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Free Account';
        }
      });
    });
  </script>
</body>
</html>

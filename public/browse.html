      <nav class="main-nav" id="main-nav">
        <!-- Dynamic header -->

      <div class="header-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
          <span class="theme-icon moon-icon">

          </span>
          <span class="theme-icon sun-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="theme-text">Theme</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top:36px;">
      <h1 class="section-title">All Prompts</h1>
      <p class="section-sub" id="prompt-count-sub">Explore the complete viral library</p>

      <!-- Search & Filters -->
      <div class="filters">
        <div class="search-form">
          <input type="text" id="search-input" placeholder="Search prompts by title or keywords…">
          <select id="sort-select">
            <option value="new">Newest First</option>
            <option value="popular">Most Popular</option>
            <option value="old">Oldest First</option>
            <option value="az">Name A–Z</option>
            <option value="za">Name Z–A</option>
          </select>
        </div>

        <!-- Type Pills -->
        <div class="cat-pills" id="type-pills" style="margin-bottom:12px;">
          <button type="button" class="pill active" data-type="all">All Prompts</button>
          <button type="button" class="pill" data-type="free">🎁 Free</button>
          <button type="button" class="pill" data-type="premium">⭐ Premium</button>
        </div>

        <!-- Category Pills -->
        <div class="cat-pills" id="category-pills">
          <button type="button" class="pill active" data-cat="all">All Categories</button>
          <!-- Dynamic categories -->
        </div>
      </div>

      <!-- Prompts Grid -->
      <div class="grid" id="prompts-grid">
        <div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);">Loading prompt library…</div>
      </div>

      <!-- Pagination / Load More -->
      <div style="text-align:center;margin-bottom:60px;" id="load-more-wrap">
        <button type="button" id="load-more-btn" class="btn btn-outline btn-lg" style="display:none;">Load More Prompts</button>
      </div>
    </div>
  </main>

  <!-- Floating WhatsApp Support -->
  <a href="https://wa.me/919131421048?text=Hi%21+I%27m+browsing+Sami+Prompts+and+need+assistance." target="_blank" rel="noopener" class="wa-float" title="WhatsApp Support">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.21 5.1 4.5.71.31 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12.05 21.79h-.01a9.72 9.72 0 0 1-4.96-1.36l-.36-.21-3.69.97.98-3.6-.23-.37a9.72 9.72 0 0 1-1.49-5.18c0-5.37 4.37-9.74 9.75-9.74a9.68 9.68 0 0 1 6.89 2.86 9.68 9.68 0 0 1 2.85 6.89c0 5.38-4.37 9.74-9.73 9.74zm8.28-18.02A11.64 11.64 0 0 0 12.05.33C5.6.33.35 5.58.35 12.03c0 2.06.54 4.07 1.56 5.84L.25 23.79l6.07-1.59a11.68 11.68 0 0 0 5.72 1.46h.01c6.45 0 11.7-5.25 11.7-11.7 0-3.13-1.22-6.07-3.42-8.19z"/></svg>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="f-left">
        <div class="footer-brand">
          <img src="/assets/img/logo.png" alt="Sami Prompts Logo">
          <span>Sami<b>Prompts</b></span>
        </div>
        <p class="footer-tag">Viral AI video prompts by Sami</p>
      </div>
      <nav class="footer-nav f-center">
        <a href="/browse">All Prompts</a>
        <span class="footer-dot">·</span>
        <a href="/community">Social Corner</a>
        <span class="footer-dot">·</span>
        <a href="/pricing">Join Community</a>
        <span class="footer-dot">·</span>
        <a href="/contact">Contact</a>
        <span class="footer-dot">·</span>
        <a href="/privacy">Privacy</a>
        <span class="footer-dot">·</span>
        <a href="/terms">Terms</a>
        <span class="footer-dot">·</span>
        <a href="/refund">Refunds</a>
      </nav>
      <div class="f-right">
        <p class="footer-copy">© 2026 Sami Prompts</p>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    let state = {
      q: '',
      type: 'all',
      cat: 'all',
      sort: 'new',
      offset: 0,
      limit: 12
    };

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        const data = await res.json();
        const pillsWrap = document.getElementById('category-pills');
        const urlParams = new URLSearchParams(window.location.search);
        const activeCat = urlParams.get('cat') || 'all';

        data.categories.forEach(c => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `pill ${c.name === activeCat ? 'active' : ''}`;
          btn.dataset.cat = c.name;
          btn.textContent = `${c.name} (${c.count})`;
          btn.addEventListener('click', () => {
            document.querySelectorAll('#category-pills .pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            state.cat = c.name;
            state.offset = 0;
            loadPrompts(true);
          });
          pillsWrap.appendChild(btn);
        });
      } catch (err) {
        console.error('Error loading categories:', err);
      }
    }

    async function loadPrompts(reset = false) {
      if (reset) {
        state.offset = 0;
        document.getElementById('prompts-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);">Loading prompts…</div>';
      }

      const params = new URLSearchParams({
        q: state.q,
        type: state.type,
        cat: state.cat,
        sort: state.sort,
        limit: state.limit,
        offset: state.offset
      });

      try {
        const res = await fetch(`/api/prompts?${params.toString()}`);
        const data = await res.json();

        document.getElementById('prompt-count-sub').textContent = `${data.total} prompts available`;

        const grid = document.getElementById('prompts-grid');
        if (reset) grid.innerHTML = '';

        if (!data.prompts || data.prompts.length === 0) {
          if (reset) {
            grid.innerHTML = `
              <div style="grid-column:1/-1;text-align:center;padding:60px 20px;">
                <div style="font-size:38px;margin-bottom:12px;">🔍</div>
                <h3>No prompts found</h3>
                <p style="color:var(--muted);margin-top:6px;">Try clearing your search query or changing filters.</p>
              </div>
            `;
          }
          document.getElementById('load-more-btn').style.display = 'none';
          return;
        }

        const cardsHtml = data.prompts.map(p => `
          <a class="pcard" href="/prompt?id=${p.id}">
            <div class="pcard-thumb">
              <img src="${p.thumbnail || '/assets/img/cover.jpg'}" alt="${p.title}" loading="lazy">
              <span class="pcard-badge ${p.type}">
                ${p.type === 'free' ? '🎁 Free' : '⭐ Premium'}
              </span>
            </div>
            <div class="pcard-body">
              <h3>${p.title}</h3>
              <span class="pcard-cat">📂 ${p.category}</span>
              <div class="pcard-foot">
                <span style="font-size:12.5px;color:var(--muted);">👁 ${p.views_count} · 📋 ${p.copies_count}</span>
                <span class="btn btn-sm ${p.type === 'free' ? 'btn-outline' : 'btn-primary'}">
                  ${p.type === 'free' ? 'Get Access' : 'Unlock'}
                </span>
              </div>
            </div>
          </a>
        `).join('');

        grid.insertAdjacentHTML('beforeend', cardsHtml);

        const loadMoreBtn = document.getElementById('load-more-btn');
        if (data.has_more) {
          loadMoreBtn.style.display = 'inline-block';
        } else {
          loadMoreBtn.style.display = 'none';
        }
      } catch (err) {
        console.error('Error loading prompts:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Parse query params
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('type')) {
        state.type = urlParams.get('type');
        document.querySelectorAll('#type-pills .pill').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.type === state.type);
        });
      }
      if (urlParams.has('cat')) {
        state.cat = urlParams.get('cat');
      }
      if (urlParams.has('q')) {
        state.q = urlParams.get('q');
        document.getElementById('search-input').value = state.q;
      }

      loadCategories();
      loadPrompts(true);

      // Search debounce
      let searchTimeout = null;
      document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          state.q = e.target.value.trim();
          loadPrompts(true);
        }, 300);
      });

      // Sort change
      document.getElementById('sort-select').addEventListener('change', (e) => {
        state.sort = e.target.value;
        loadPrompts(true);
      });

      // Type buttons
      document.querySelectorAll('#type-pills .pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#type-pills .pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.type = btn.dataset.type;
          loadPrompts(true);
        });
      });

      // Category "All" button
      document.querySelector('#category-pills [data-cat="all"]').addEventListener('click', (e) => {
        document.querySelectorAll('#category-pills .pill').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.cat = 'all';
        loadPrompts(true);
      });

      // Load More
      document.getElementById('load-more-btn').addEventListener('click', () => {
        state.offset += state.limit;
        loadPrompts(false);
      });
    });
  </script>
</body>
</html>

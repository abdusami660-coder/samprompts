<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community — Sami Prompts Social Corner</title>
  <meta name="description" content="Share your AI video wins, generated clips, workflows and questions with the Sami Prompts creator community.">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo.png" alt="Sami Prompts Logo">
        <span>Sami<b>Prompts</b></span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle-cb">
      <label for="nav-toggle" class="nav-toggle">☰</label>
      <nav class="main-nav" id="main-nav">

      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="community-wrap">
        <h1 class="section-title" style="margin-top:20px;">Community</h1>
        <p class="section-sub">Share your wins, prompt tests & viral creations 🚀</p>

        <!-- Post Composer -->
        <div class="composer">
          <form id="composer-form" enctype="multipart/form-data">
            <textarea id="post-content" placeholder="Share something with the creator community…" maxlength="3000" required></textarea>
            <div class="composer-foot">
              <label class="composer-attach">
                📎 Attach Image
                <input type="file" id="post-media" accept="image/*" style="display:none;">
                <span id="attach-label" style="font-size:12px;color:var(--green);font-weight:600;margin-left:6px;"></span>
              </label>
              <button type="submit" id="post-submit-btn" class="btn btn-primary btn-sm">Post to Feed</button>
            </div>
          </form>
        </div>

        <!-- Community Posts Feed -->
        <div id="posts-feed">
          <div style="text-align:center;padding:40px;color:var(--muted);">Loading community feed…</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Floating WhatsApp Support -->
  <a href="https://wa.me/919131421048?text=Hi%21+I%27m+a+member+of+your+community." target="_blank" rel="noopener" class="wa-float" title="WhatsApp Support">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.21 5.1 4.5.71.31 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12.05 21.79h-.01a9.72 9.72 0 0 1-4.96-1.36l-.36-.21-3.69.97.98-3.6-.23-.37a9.72 9.72 0 0 1-1.49-5.18c0-5.37 4.37-9.74 9.75-9.74a9.68 9.68 0 0 1 6.89 2.86 9.68 9.68 0 0 1 2.85 6.89c0 5.38-4.37 9.74-9.73 9.74zm8.28-18.02A11.64 11.64 0 0 0 12.05.33C5.6.33.35 5.58.35 12.03c0 2.06.54 4.07 1.56 5.84L.25 23.79l6.07-1.59a11.68 11.68 0 0 0 5.72 1.46h.01c6.45 0 11.7-5.25 11.7-11.7 0-3.13-1.22-6.07-3.42-8.19z"/></svg>
    <span>Support</span>
  </a>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="f-left">
        <div class="footer-brand">
          <img src="/assets/img/logo.png" alt="Sami Prompts Logo">
          <span>Sami<b>Prompts</b></span>
        </div>
        <p class="footer-tag">Viral AI video prompts by Sami</p>
      </div>
      <nav class="footer-nav f-center">
        <a href="/browse">All Prompts</a>
        <span class="footer-dot">·</span>
        <a href="/community">Social Corner</a>
        <span class="footer-dot">·</span>
        <a href="/pricing">Join Community</a>
        <span class="footer-dot">·</span>
        <a href="/contact">Contact</a>
        <span class="footer-dot">·</span>
        <a href="/privacy">Privacy</a>
        <span class="footer-dot">·</span>
        <a href="/terms">Terms</a>
        <span class="footer-dot">·</span>
        <a href="/refund">Refunds</a>
      </nav>
      <div class="f-right">
        <p class="footer-copy">© 2026 Sami Prompts</p>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    async function loadCommunity() {
      try {
        const res = await fetch('/api/community/posts');
        const data = await res.json();
        const feed = document.getElementById('posts-feed');

        if (!data.posts || data.posts.length === 0) {
          feed.innerHTML = '<p style="text-align:center;padding:40px;color:var(--muted);">No posts yet. Be the first to share!</p>';
          return;
        }

        feed.innerHTML = data.posts.map(p => {
          const initial = (p.author || 'U')[0].toUpperCase();
          const commentsList = (p.comments || []).map(c => `
            <div class="ccomment">
              <strong>${escapeHtml(c.author)}</strong>
              <span>${escapeHtml(c.content)}</span>
            </div>
          `).join('');

          return `
            <div class="cpost" id="post-${p.id}">
              <div class="cpost-head">
                <span class="cpost-avatar">${initial}</span>
                <div>
                  <strong>${escapeHtml(p.author)}</strong>
                  ${p.is_admin ? '<span class="cpost-admin-badge">Creator ✔</span>' : ''}
                  <div class="cpost-time">${formatDate(p.created_at)}</div>
                </div>
              </div>

              <div class="cpost-text">${escapeHtml(p.content).replace(/\n/g, '<br>')}</div>

              ${p.media_url ? `
                <div class="cpost-media">
                  <img src="${p.media_url}" alt="Attachment" class="lb-img" loading="lazy" style="max-height:400px;object-fit:cover;width:100%;border-radius:10px;">
                </div>
              ` : ''}

              <div class="cpost-actions">
                <button type="button" class="cact ${p.has_liked ? 'liked' : ''}" onclick="toggleLike(${p.id}, this)">
                  ${p.has_liked ? '❤️' : '🤍'} <span class="like-cnt">${p.likes}</span>
                </button>
                <button type="button" class="cact" onclick="toggleComments(${p.id})">
                  💬 <span class="comment-cnt">${(p.comments || []).length}</span>
                </button>
                <button type="button" class="cact share-btn" data-link="${window.location.origin}/community#post-${p.id}">
                  🔗 Share
                </button>
              </div>

              <div class="cpost-comments" id="comments-${p.id}" style="display:none;">
                <div class="comments-list">
                  ${commentsList || '<p style="font-size:13px;color:var(--muted);margin-bottom:8px;">No comments yet.</p>'}
                </div>
                <form class="ccomment-form" onsubmit="submitComment(event, ${p.id})">
                  <input type="text" placeholder="Write a comment…" maxlength="500" required>
                  <button type="submit" class="btn btn-sm btn-primary">Send</button>
                </form>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading community:', err);
      }
    }

    async function toggleLike(postId, btn) {
      if (!window.NP.user) {
        window.location.href = '/login?next=/community';
        return;
      }
      try {
        const res = await fetch(`/api/community/posts/${postId}/like`, { method: 'POST' });
        const data = await res.json();
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
          btn.innerHTML = `${data.liked ? '❤️' : '🤍'} <span class="like-cnt">${data.likes}</span>`;
        }
      } catch (err) {
        console.error('Like error:', err);
      }
    }

    function toggleComments(postId) {
      const el = document.getElementById(`comments-${postId}`);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    }

    async function submitComment(e, postId) {
      e.preventDefault();
      const form = e.target;
      const input = form.querySelector('input');
      const text = input.value.trim();
      if (!text) return;

      try {
        const res = await fetch(`/api/community/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: text })
        });
        const data = await res.json();
        if (data.success) {
          const list = form.parentElement.querySelector('.comments-list');
          if (list.innerHTML.includes('No comments yet')) list.innerHTML = '';
          const cEl = document.createElement('div');
          cEl.className = 'ccomment';
          cEl.innerHTML = `<strong>${escapeHtml(data.comment.author)}</strong><span>${escapeHtml(data.comment.content)}</span>`;
          list.appendChild(cEl);
          input.value = '';

          // update count
          const cntSpan = form.closest('.cpost').querySelector('.comment-cnt');
          if (cntSpan) cntSpan.textContent = parseInt(cntSpan.textContent, 10) + 1;
        }
      } catch (err) {
        console.error('Comment error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCommunity();

      // File attachment display
      const fileInput = document.getElementById('post-media');
      const fileLabel = document.getElementById('attach-label');
      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
          fileLabel.textContent = `✓ ${fileInput.files[0].name}`;
        } else {
          fileLabel.textContent = '';
        }
      });

      // Post creation
      document.getElementById('composer-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('post-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Posting…';

        const formData = new FormData();
        formData.append('content', document.getElementById('post-content').value);
        if (fileInput.files.length) {
          formData.append('media', fileInput.files[0]);
        }

        try {
          const res = await fetch('/api/community/posts', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById('post-content').value = '';
            fileInput.value = '';
            fileLabel.textContent = '';
            window.NP.showToast('🚀 Post published successfully!');
            await loadCommunity();
          } else {
            alert(data.error || 'Failed to post.');
          }
        } catch (err) {
          alert('Network error while posting.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Post to Feed';
        }
      });
    });

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'Recently';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
  </script>
</body>
</html>
